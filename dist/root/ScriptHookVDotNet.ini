# Hardened Offline-Only ScriptHookVDotNet configuration for StoryModeTrainer.
# Both ConsoleKeyBinding and ReloadKeyBinding are locked to None so StoryModeTrainer's
# active GTA Online lockout cannot be paused, aborted, or bypassed from an in-game console
# while ASI/SHVDN binaries are loaded in GTA5.exe.

; Disables in-game script reload hotkey.
ReloadKeyBinding=None

; Disables in-game developer console hotkey so Online-lockout scripts cannot be stopped mid-session.
ConsoleKeyBinding=None

; Timeout threshold in milliseconds per script tick.
ScriptTimeoutThreshold=5000

; Relative directory under GTA5.exe root containing managed scripts.
ScriptsLocation="scripts"

; Automatically start StoryModeTrainer when Story Mode initializes.
AutoLoadScripts=true
