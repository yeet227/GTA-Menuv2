; StoryModeTrainer configuration (placed in GTA V\scripts\StoryModeTrainer.ini)

[Controls]
; Any System.Windows.Forms.Keys enum name (e.g. F3, F5, Insert, F9, NumPad0).
; F3 and F9 avoid colliding with SHVDN ConsoleKeyBinding (F4) and GTA character switch keys (F5-F8).
MenuToggleKey=F3
NoClipToggleKey=F9

[Spawner]
; Automatically remove the previously trainer-spawned vehicle when spawning a new one
DespawnPreviousVehicle=true
; Automatically install max performance upgrades and turbo on newly spawned vehicles
SpawnMaxUpgraded=false
; Automatically repair the currently driven vehicle when damaged
AutoRepairVehicle=false

[NoClip]
; Base movement speed in meters/second before menu preset & Shift boost (2..200)
BaseSpeed=18
; Grant a 3-second impact/ragdoll shield when turning No-Clip off in mid-air
ExitFallShield=true
; Snap directly onto ground below when exiting No-Clip (false lets you stop in interiors/ledges)
SnapToGroundOnExit=false

[Heists]
; Automatically block police bullet/explosion/damage money loss during Story Mode heists on startup
ProtectTakeByDefault=false
; When editing heist take, keep 100% split among protagonists without deducting crew or FBI/Lester cuts
KeepFullTakeWithoutCuts=true

[Player]
; Optional startup defaults for offline Single-Player protections, weapons, stamina, and Character Wheel
GodMode=false
VehicleGodMode=false
NeverWanted=false
InfiniteAmmo=false
InfiniteClip=false
InfiniteSprint=false
InfiniteSpecialAbility=false
CharacterWheelSwap=true

[OnlineAssets]
; Mark trainer-spawned vehicles (including GTA Online DLC models) as mission-persistent offline
KeepSpawnedVehiclesPersistent=true
; Enable Single-Player DLC map changeset priority on startup (false keeps default until a DLC map is loaded)
AutoUnlockMpMaps=false
